<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Soft headings landing</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }
      .block {
        padding: 24px;
      }
      .section-label {
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 12px;
      }
      img {
        width: 120px;
        height: 80px;
        background: #ccc;
        display: inline-block;
        margin-right: 8px;
      }
    </style>
  </head>
  <body>
    <div class="block">
      <div class="hero-title" style="font-size: 28px; font-weight: 700">
        Кровля под ключ
      </div>
      <p>Поставка и монтаж без семантических h1–h6 на странице.</p>
    </div>

    <div class="block" id="works-soft">
      <div class="section-label">Наши работы</div>
      <p>Фото реальных объектов.</p>
      <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="Объект 1" />
      <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="Объект 2" />
    </div>

    <div class="block" id="reviews-soft">
      <span class="section-label">Отзывы клиентов о компании</span>
      <p>Скриншоты отзывов без OCR.</p>
      <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="Отзыв 1" />
      <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="Отзыв 2" />
    </div>
  </body>
</html>
